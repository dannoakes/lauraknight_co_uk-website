<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery</title>
</head>
<body>
    <h1>Gallery</h1>
    <div class="gallery">
      <!-- 
        To embed your Google Photos album:
        1. Go to your Google Photos and open the album you want to share.
        2. Click 'Share' and create a link if you haven't already.
        3. Copy the share link.
        4. Visit https://embed-google-photos.com/ and paste your album link to generate an iframe embed code.
        5. Copy the src URL from that iframe.
        6. Replace 'YOUR_GOOGLE_PHOTOS_EMBED_URL' in the iframe below with the link you just copied.
      -->
      <iframe src="YOUR_GOOGLE_PHOTOS_EMBED_URL" width="600" height="400" frameborder="0"></iframe>
    </div>
</body>
</html>
